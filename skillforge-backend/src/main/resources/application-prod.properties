# ==============================================================================
# SKILLFORGE BACKEND - PRODUCTION APPLICATION CONFIGURATION (application-prod.properties)
# ==============================================================================
# This configuration profile is activated when running in production environments
# (e.g. Render.com, Railway, Docker container with -Dspring.profiles.active=prod).
# All sensitive secrets and host-dependent configurations are injected via
# Cloud Environment Variables to follow 12-Factor App principles.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SERVER CONFIGURATION
# ------------------------------------------------------------------------------
# Cloud platforms like Render.com dynamically assign an internal port via $PORT.
# Fallback to 8080 if not explicitly supplied by the cloud container runtime.
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# 2. PRODUCTION POSTGRESQL DATASOURCE (Neon.tech / Supabase / Cloud Provider)
# ------------------------------------------------------------------------------
# Example Neon JDBC URL format:
# jdbc:postgresql://ep-xyz.ap-southeast-1.aws.neon.tech/skillforge-db?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool settings tuned for cloud environments
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=SkillForgeHikariCP

# ------------------------------------------------------------------------------
# 3. JPA / HIBERNATE CONFIGURATION
# ------------------------------------------------------------------------------
# In production, 'update' ensures tables & columns are automatically verified/created
# without dropping existing user data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------------------------------------
# 4. JWT (JSON WEB TOKEN) SECURITY CONFIGURATION
# ------------------------------------------------------------------------------
# Minimum 256-bit secure secret key injected from cloud dashboard (never hardcoded)
app.jwt.secret=${JWT_SECRET}
# 24 Hours in milliseconds (24 * 60 * 60 * 1000 = 86400000)
app.jwt.expiration=86400000

# ------------------------------------------------------------------------------
# 5. GROQ CLOUD AI CONFIGURATION
# ------------------------------------------------------------------------------
# Ultra-fast inference using Groq LPU Cloud (Llama-3.3-70B-versatile)
app.groq.api-key=${GROQ_API_KEY}
app.groq.api-url=https://api.groq.com/openai/v1/chat/completions
app.groq.model=llama-3.3-70b-versatile

# ------------------------------------------------------------------------------
# 6. LOGGING
# ------------------------------------------------------------------------------
# Keep production logs concise and informative
logging.level.root=INFO
logging.level.com.skillforge=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
