# ===============================================
# SKILLFORGE BACKEND - APPLICATION CONFIGURATION
# ===============================================

# Application name
spring.application.name=skillforge-backend

# Server port
server.port=8080

# -----------------------------------------------
# DATABASE CONFIGURATION
# -----------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/skillforge_db
spring.datasource.username=skillforge_user
spring.datasource.password=skillforge@123
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------
# JPA / HIBERNATE
# -----------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------------------------
# JWT CONFIGURATION
# -----------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000

# -----------------------------------------------
# LOGGING
# -----------------------------------------------
logging.level.com.skillforge=DEBUG
logging.level.org.springframework.security=DEBUG
